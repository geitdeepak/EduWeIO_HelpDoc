site_name: EduWe Help
site_description: Help for learners, instructors and administrators on eduwe.io
# TODO: use the GitHub Pages URL here until DNS for help.eduwe.io is live
site_url: https://help.eduwe.io/
docs_dir: docs
use_directory_urls: true
copyright: "© 2026 EduWe. All rights reserved."

extra:
  # Replaces the default "Made with Material for MkDocs" footer line with the copyright above.
  generator: false

theme:
  name: material
  language: en
  # Small template override (overrides/partials/content.html) that adds the per-page role/summary
  # banner described in STYLE-GUIDE.md "Page Head". Everything else here is stock Material.
  custom_dir: overrides
  font:
    text: Nunito
    code: Roboto Mono
  logo: assets/logo/eduwe-logo.png
  favicon: assets/logo/favicon.png
  palette:
    # Dark first to match EduWe; the toggle switches to light.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/zoom.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - Create An Account: getting-started/create-account.md
      - Log In: getting-started/log-in.md
      - Your Dashboard: getting-started/dashboard.md
      - Themes And Display: getting-started/themes-and-display.md
  - Learners:
      - Browse The Catalog: learner/browse-catalog.md
      - Course Codes: learner/course-codes.md
      - Fully Paid Vs On Demand: learner/pricing-models.md
      - Watch A Demo: learner/watch-a-demo.md
      - Cart And Checkout: learner/cart-and-checkout.md
      - My Courses: learner/my-courses.md
      - Taking A Course: learner/taking-a-course.md
      - Quizzes And Assignments: learner/quizzes-and-assignments.md
      - Certificates: learner/certificates.md
      - Profile And Settings: learner/profile-and-settings.md
  # Instructors and Administrators sections are hidden until their guides are written.
  # The content lives in ../drafts/instructor and ../drafts/admin (moved out of docs/ so
  # they build no pages and appear in no nav). Move a folder back under docs/ and add its
  # nav block here (see git history of this file) to bring a section back.
  - Support:
      - FAQ: support/faq.md
      - Troubleshooting: support/troubleshooting.md
      - Contact: support/contact.md
